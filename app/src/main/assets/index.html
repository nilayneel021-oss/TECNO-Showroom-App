<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TECNO Official Showroom by TECH Hub</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#14182b;--mu:#6b7287;--bd:#e3e7f1;--pr:#4f46e5;--pt:#fff;--ok:#0f9d6b;--bad:#dc2f4a;--warn:#d98a0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mu:#9aa1ba;--bd:#2a3050;--pr:#818cf8;--pt:#10132a;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mu:#9aa1ba;--bd:#2a3050;--pr:#818cf8;--pt:#10132a;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.top h1{font-size:16px;margin:0;line-height:1.25}.top small{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
nav button{flex:none;border:0;background:transparent;color:var(--mu);padding:8px 13px;border-radius:99px;font:600 13px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:var(--pt)}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid .card{margin:0}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.v{font-size:22px;font-weight:700;margin-top:2px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0}.hero .k{color:#dcd9ff}
h2{font-size:15px;margin:0 0 10px}
form,.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:grid;gap:4px;font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pr);outline-offset:0}
.btn{border:0;background:var(--pr);color:var(--pt);padding:11px 16px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.s{padding:7px 11px;font-size:12px}.btn.g{background:transparent;color:var(--bad);border:1px solid var(--bd)}.btn.o{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}.row b{display:block}.row small{color:var(--mu)}
.r{text-align:right}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.full{grid-column:1/-1}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.bar label{flex:1;min-width:130px}
.empty{color:var(--mu);text-align:center;padding:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}
#toast.show{opacity:1}
.shelf{border-top:1px solid var(--bd);padding:8px 0}.shelf:first-child{border-top:0}summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;list-style:none}summary::-webkit-details-marker{display:none}summary small{display:block;color:var(--mu)}textarea{resize:vertical;font-family:ui-monospace,monospace}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}@media(min-width:640px){.tiles{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}.tile{position:relative;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:12px 4px 10px;text-align:center;cursor:pointer;font:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.tile:active{transform:scale(.96)}.tile i{font-style:normal;font-size:26px;width:50px;height:50px;display:grid;place-items:center;border-radius:15px;margin-bottom:2px}.tile b{font-size:13px;line-height:1.2}.tile small{font-size:11px;color:var(--mu)}.tile .bd{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
</style></head>
<body>
<header><div class="top"><div><h1><svg width="36" height="36" viewBox="0 0 48 48" style="vertical-align:-10px;margin-right:6px"><rect width="48" height="48" rx="11" fill="#4F46E5"/><rect x="15" y="8" width="18" height="32" rx="4" fill="#fff"/><rect x="18" y="12" width="12" height="20" rx="1.5" fill="#4F46E5"/><rect x="22.5" y="35" width="3" height="1.5" rx=".7" fill="#4F46E5"/></svg><span id="shn">TECNO Official Showroom by TECH Hub</span></h1><small id="sha">Bazar Road, Beside The One Bank, Sadar Lakshmipur</small><br><small id="dt"></small></div></div><nav id="nav"></nav></header>
<main id="app"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ACCS=['BRAC Bank','Tecno Virtual Account','PalmPay','Cash On Hand'];
const K='mobshop_v1';
let db={phones:[],acc:[],promos:[],sales:[],txns:[]};
try{let s=localStorage.getItem(K);if(!s&&window.Android&&typeof Android.loadData==='function')s=Android.loadData();if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
db.set=Object.assign({shop:'TECNO Official Showroom by TECH Hub',addr:'Bazar Road, Beside The One Bank, Sadar Lakshmipur',tel:'',low:3,lock:10,months:3,accs:[...ACCS]},db.set);db.del=db.del||[];db.notes=db.notes||[];ACCS.length=0;ACCS.push(...db.set.accs);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}try{if(window.Android&&typeof Android.persist==='function')Android.persist(JSON.stringify(db))}catch(e){}if(typeof driveSoon==='function')driveSoon()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const addM=(s,n)=>{const d=new Date(s+'T00:00');d.setMonth(d.getMonth()+n);return fmt(d)};
const M=n=>'৳'+Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>($(id)||{}).value||'';
const opts=(arr,sel)=>arr.map(a=>`<option value="${esc(a[0])}"${a[0]===sel?' selected':''}>${esc(a[1])}</option>`).join('');
const accOpts=sel=>opts(ACCS.map(a=>[a,a]),sel);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function txn(acc,type,amt,note,cat){if(amt>0)db.txns.push({id:uid(),date:today(),time:new Date().toTimeString().slice(0,5),acc,type,amt,note,cat})}
const bal=a=>db.txns.filter(t=>t.acc===a).reduce((s,t)=>s+(t.type==='in'?t.amt:-t.amt),0);
const paidOf=s=>s.paid+(s.pays||[]).reduce((a,p)=>a+p.amt,0);

let view='dash',dd=today(),sf={kind:'phone',item:'',qty:1,price:'',promo:'',cust:'',phone:'',pay:'full',down:'',months:db.set.months,acc:ACCS[3]||ACCS[0]};
let q='',ex={from:today(),to:today()};
const TABS=[['dash','🏠 Home'],['notes','Notifications'],['sell','🛒 Sell'],['hist','🧾 Sales'],['phones','📱 Mobiles'],['acc','🎧 Accessories'],['inst','💳 Installments'],['accounts','🏦 Accounts'],['promos','🏷️ Promos'],['users','👥 Users'],['settings','⚙️ Settings']];
function go(v){if(!tabOk(v))return;view=v;q='';ckR='';draw();try{scrollTo(0,0)}catch(e){}}
const empty=t=>`<div class="empty">${t}</div>`;

const V={};
V.dash=()=>{
  const S=db.sales.filter(s=>s.date===dd&&!s.returned);
  const tot=S.reduce((a,s)=>a+s.total,0);
  const col=db.txns.filter(t=>t.date===dd&&t.type==='in'&&(t.cat==='sale'||t.cat==='inst')).reduce((a,t)=>a+t.amt,0);
  const stock=db.phones.filter(p=>p.status==='in').length;
  const low=db.acc.filter(a=>a.qty<=db.set.low);
  const due=db.sales.filter(s=>s.pay==='inst'&&!s.returned).reduce((a,s)=>a+Math.max(0,s.total-paidOf(s)),0);
  return `${can('accounts')?`<div class="card hero"><div class="k">${dd===today()?'Today':esc(dd)} · Sales</div><div class="v" style="font-size:32px">${M(tot)}</div><div style="opacity:.9">${S.length} sale(s) · collected ${M(col)}</div></div>`:''}
  ${homeGrid()}
  ${noteCard()}${ckCard()}
  <div class="grid" style="margin-bottom:12px">
   ${can('accounts')?ACCS.map(a=>`<div class="card"><div class="k">${a}</div><div class="v ${bal(a)<0?'bad':''}">${M(bal(a))}</div></div>`).join(''):''}
   <div class="card"><div class="k">Phones in stock</div><div class="v">${stock}</div></div>
   ${can('accounts')?`<div class="card"><div class="k">Installment due</div><div class="v warn">${M(due)}</div></div>`:''}</div>
  <div class="card"><div class="bar"><label>Check sales of date<input type="date" value="${dd}" onchange="dd=this.value||today();draw()"></label></div>
  <h2>Products sold</h2>
  ${S.length?S.slice().reverse().map(s=>`<div class="row"><div><b>${esc(s.name)}${s.qty>1?' ×'+s.qty:''}</b><small>${s.imei?'IMEI '+esc(s.imei)+' · ':''}${esc(s.cust||'Walk-in')}${s.phone?' · '+esc(s.phone):''}</small></div><div class="r"><b>${can('accounts')?M(s.total):''}</b>${s.pay==='inst'?'<span class="tag">Installment</span>':''}</div></div>`).join(''):empty('No sales on this date')}</div>
  ${low.length?`<div class="card"><h2>⚠️ Low accessories stock</h2>${low.map(a=>`<div class="row"><b>${esc(a.name)}</b><span class="tag bad">${a.qty} left</span></div>`).join('')}</div>`:''}`;
};

const mkey=p=>(p.brand+' '+p.model).trim().toLowerCase();
function models(){const m={};db.phones.forEach(p=>{const k=mkey(p);(m[k]=m[k]||{key:k,name:p.brand+' '+p.model,list:[]}).list.push(p)});return Object.values(m).sort((a,b)=>a.name.localeCompare(b.name))}
const findItem=id=>db.phones.find(p=>p.id===id)||db.acc.find(a=>a.id===id);

V.sell=()=>{
  const ms=models().filter(m=>m.list.some(p=>p.status==='in')),ac=db.acc.filter(a=>a.qty>0);
  const cur=ms.find(m=>m.key===sf.model);
  const imeis=cur?cur.list.filter(p=>p.status==='in').map(p=>[p.id,p.imei]):[];
  const g=calc();
  return `<div class="card"><h2>New sale</h2><div class="f">
  <label>Type<select onchange="sf.kind=this.value;sf.item='';sf.price='';sf.model='';draw()"><option value="phone"${sf.kind==='phone'?' selected':''}>Mobile phone</option><option value="acc"${sf.kind==='acc'?' selected':''}>Accessory</option></select></label>
  ${sf.kind==='phone'?`<label class="full">Find by IMEI (scan or type)<div style="display:flex;gap:6px"><input id="si" inputmode="numeric" placeholder="IMEI" onchange="imeiPick(this.value)">${canScan()?`<button class="btn o" onclick="scanGo('sell')">📷</button>`:''}</div></label>
  <label>Model<select onchange="setModel(this.value)"><option value="">— select —</option>${opts(ms.map(m=>[m.key,m.name+' ('+m.list.filter(p=>p.status==='in').length+')']),sf.model)}</select></label>
  <label>IMEI<select onchange="pick(this.value)"><option value="">— select —</option>${opts(imeis,sf.item)}</select></label>`
  :`<label class="full">Product<select onchange="pick(this.value)"><option value="">— select —</option>${opts(ac.map(a=>[a.id,a.name+' ('+a.qty+' in stock)']),sf.item)}</select></label>
  <label>Quantity<input type="number" min="1" value="${sf.qty}" onchange="sset('qty',this.value);draw()"></label>`}
  <label>Unit price (৳)<input type="number" min="0" value="${sf.price}"${can('price')?'':' disabled'} onchange="sset('price',this.value);draw()"></label>
  <label>Promo offer<select onchange="sset('promo',this.value);draw()"><option value="">None</option>${opts(db.promos.filter(p=>p.on).map(p=>[p.id,p.name+' ('+(p.type==='pct'?p.val+'%':M(p.val))+')']),sf.promo)}</select></label>
  <label>Customer name<input value="${esc(sf.cust)}" onchange="sset('cust',this.value)"></label>
  <label>Customer number<input type="tel" value="${esc(sf.phone)}" onchange="sset('phone',this.value)"></label>
  <label>Payment<select onchange="sset('pay',this.value);draw()"><option value="full"${sf.pay==='full'?' selected':''}>Full payment</option><option value="inst"${sf.pay==='inst'?' selected':''}>Installment</option></select></label>
  ${sf.pay==='inst'?`<label>Down payment (৳)<input type="number" min="0" value="${sf.down}" onchange="sset('down',this.value);draw()"></label><label>Months<input type="number" min="1" max="36" value="${sf.months}" onchange="sset('months',this.value);draw()"></label>`:''}
  <label>Money received into<select onchange="sset('acc',this.value)">${accOpts(sf.acc)}</select></label></div>
  <div class="row" style="margin-top:10px"><div><small>Discount ${M(g.disc)}</small><b style="font-size:20px">Total ${M(g.total)}</b>${sf.pay==='inst'?`<small>Balance ${M(g.total-g.down)} · ${M(g.monthly)}/month</small>`:''}</div><button class="btn" onclick="sell()">Complete sale</button></div></div>`;
};
function sset(k,v){sf[k]=v}
function setModel(k){sf.model=k;const m=models().find(x=>x.key===k),p=m&&m.list.find(x=>x.status==='in');sf.item=p?p.id:'';sf.price=p?p.price:'';draw()}
function pick(id){sf.item=id;const it=findItem(id);sf.price=it?it.price:'';draw()}
function calc(){
  const qty=sf.kind==='phone'?1:Math.max(1,+sf.qty||1),gross=(+sf.price||0)*qty;
  const p=db.promos.find(x=>x.id===sf.promo);
  const disc=p?Math.min(gross,p.type==='pct'?Math.round(gross*p.val/100):p.val):0;
  const total=gross-disc,months=Math.max(1,+sf.months||1);
  const down=sf.pay==='inst'?Math.min(total,Math.max(0,+sf.down||0)):total;
  return{qty,gross,disc,total,down,months,monthly:Math.ceil((total-down)/months)};
}
function sell(){if(!can('sell'))return toast('Not allowed');
  const g=calc(),it=findItem(sf.item);
  if(!it)return toast('Select a product');
  if(!(+sf.price>0))return toast('Enter a price');
  if(sf.kind==='acc'&&g.qty>it.qty)return toast('Only '+it.qty+' in stock');
  if(sf.pay==='inst'&&(!sf.cust.trim()||!sf.phone.trim()))return toast('Customer name & number required');
  const s={id:uid(),date:today(),kind:sf.kind,name:sf.kind==='phone'?it.brand+' '+it.model:it.name,imei:it.imei||'',qty:g.qty,price:+sf.price,disc:g.disc,total:g.total,cust:sf.cust.trim(),phone:sf.phone.trim(),pay:sf.pay,paid:g.down,acc:sf.acc,months:g.months,monthly:g.monthly,pays:[],by:cur?cur.name:''};
  db.sales.push(s);
  if(sf.kind==='phone'){it.status='sold';it.saleId=s.id}else it.qty-=g.qty;
  txn(sf.acc,'in',g.down,'Sale: '+s.name+(s.imei?' / '+s.imei:''),'sale');
  saleNotes(s,it);save();sf={kind:sf.kind,model:sf.model,item:'',qty:1,price:'',promo:'',cust:'',phone:'',pay:'full',down:'',months:db.set.months,acc:sf.acc};
  toast('Sale saved ✓');draw();
}

const canScan=()=>!!(window.Android&&typeof Android.scan==='function');
const scanBtn=t=>canScan()?`<button class="btn o" onclick="scanGo('${t}')">📷 Scan</button>`:'';
let scanT='',ckR='';
function scanGo(t){scanT=t;if(!canScan())return toast('Scanner works in the Android app');Android.scan()}
function onScanEnd(){scanT=''}
function onScanFail(m){scanT='';toast('Scan failed'+(m?': '+m:''))}
function onScan(raw){
  const m=String(raw).match(/\d{15}/),code=m?m[0]:String(raw).trim(),t=scanT;
  if(t==='stock'){
    const ta=$('pi');if(!ta){scanT='';return}
    if(!/^\d{15}$/.test(code)){toast('Not an IMEI: '+code);return Android.scan()}
    if(db.phones.some(p=>p.imei===code)||parseI().ok.includes(code))toast('Already added: '+code);
    else ta.value=(ta.value.trim()?ta.value.trim()+'\n':'')+code;
    imeiChk();
    if($('pi')&&val('pi').trim())Android.scan();else scanT='';
  }else if(t==='sell'){scanT='';imeiPick(code)}
  else if(t==='search'){scanT='';q=code;const e=$('qs');if(e)e.value=code;list()}
  else if(t==='check'){scanT='';const e=$('ck');if(e)e.value=code;checkImei(code)}
}
function imeiPick(v){
  v=String(v).replace(/\D/g,'');if(!v)return;
  const L=db.phones.filter(x=>x.imei===v||(v.length>=5&&x.imei.includes(v))),A=L.filter(x=>x.status==='in');
  if(A.length===1){const p=A[0];sf.kind='phone';sf.model=mkey(p);sf.item=p.id;sf.price=p.price;draw();toast('Selected '+p.brand+' '+p.model)}
  else if(A.length>1)toast('Several matches – type more digits');
  else toast(L.length?'This IMEI is already sold':'IMEI not found in stock records');
}
function ckCard(){return `<div class="card"><h2>🔎 Check IMEI</h2><div style="display:flex;gap:6px"><input id="ck" inputmode="numeric" placeholder="Full IMEI or last 5+ digits" onkeydown="if(event.key==='Enter')checkImei(this.value)">${canScan()?`<button class="btn o" onclick="scanGo('check')">📷</button>`:''}<button class="btn" onclick="checkImei($('ck').value)">Check</button></div><div id="ckr">${ckR}</div></div>`}
function checkImei(v){
  v=String(v).replace(/\D/g,'');
  if(v.length<5)ckR=empty('Enter at least 5 digits');
  else{const L=db.phones.filter(p=>p.imei.includes(v)).slice(0,8);
    ckR=L.length?L.map(p=>{const s=db.sales.filter(x=>x.imei===p.imei&&!x.returned).slice(-1)[0];
      return `<div class="row"><div><b>${esc(p.brand)} ${esc(p.model)}</b><small>IMEI ${esc(p.imei)}</small>${p.status==='in'?`<small>Price ${M(p.price)} · added ${p.date}</small>`:`<small>${s?'Sold '+s.date+' · '+esc(s.cust||'Walk-in')+(s.phone?' · '+esc(s.phone):'')+' · '+M(s.total):'Sold'}</small>`}</div><span class="tag ${p.status==='in'?'ok':'bad'}">${p.status==='in'?'In stock':'Sold'}</span></div>`}).join(''):`<div class="row"><b class="bad">Not found in your stock records</b></div>`}
  const e=$('ckr');if(e)e.innerHTML=ckR;
}

db.users=db.users||[];
const PERMS=[['sell','Sell products'],['price','Change selling price'],['stockin','Add stock (purchase)'],['cost','See purchase prices'],['del','Delete stock items'],['hist','Sales history, edit & return'],['delsale','Delete a sale'],['export','Export sales & stock to Excel'],['inst','Installments'],['accounts','Accounts, balances & totals'],['promos','Manage promos']];
let cur=null,authS={mode:'',tries:0,until:0,rc:''},recShow='',idle=Date.now();
const can=p=>!!cur&&(cur.role==='admin'||!!(cur.perms&&cur.perms[p]));
const tabOk=v=>({sell:()=>can('sell'),hist:()=>can('hist'),inst:()=>can('inst'),accounts:()=>can('accounts'),promos:()=>can('promos'),users:()=>cur&&cur.role==='admin',settings:()=>cur&&cur.role==='admin'}[v]||(()=>true))();
const rnd=()=>Math.random().toString(36).slice(2,10);
function hp(pin,salt){let s=salt+':'+pin,h1=0xdeadbeef,h2=0x41c6ce57;for(let r=0;r<3000;r++){for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909)}return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const okPin=p=>/^\d{4,8}$/.test(p);
const mkUser=(name,pin,role,perms)=>{const salt=rnd();return{id:uid(),name,salt,h:hp(pin,salt),role,perms:perms||{}}};
function newRecCode(){const rc=String(Math.floor(1e7+Math.random()*9e7)),salt=rnd();db.rec={salt,h:hp(rc,salt)};save();return rc}

function lock(){cur=null;authS.mode='';draw()}
const normLogin=s=>{s=String(s||'').trim().toLowerCase();if(s.includes('@'))return s;let d=s.replace(/[^\d]/g,'');if(d.startsWith('880')&&d.length===13)d='0'+d.slice(3);return /^\d{8,15}$/.test(d)?d:s};
const validLogin=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)||/^\d{8,15}$/.test(s);
const findUser=v=>{const k=normLogin(v),n=String(v).trim().toLowerCase();return db.users.find(u=>(u.login&&u.login===k)||u.name.toLowerCase()===n)};

function setupAdmin(){
  const n=val('an1').trim(),l=normLogin(val('al1')),p=val('ap1');
  if(!n)return toast('Enter a name');if(!validLogin(l))return toast('Enter a valid phone number or Gmail');
  if(!okPin(p))return toast('PIN must be 4–8 digits');if(p!==val('ap2'))return toast('PINs do not match');
  const u=mkUser(n,p,'admin');u.login=l;db.users.push(u);authS.rc=newRecCode();authS.mode='showrec';save();draw();
}
function createAccount(){
  const n=val('sn1').trim(),l=normLogin(val('sl1')),p=val('sp1');
  if(!n)return toast('Enter your name');if(!validLogin(l))return toast('Enter a valid phone number or Gmail');
  if(!okPin(p))return toast('PIN must be 4–8 digits');if(p!==val('sp2'))return toast('PINs do not match');
  if(db.users.some(u=>u.login===l||u.name.toLowerCase()===n.toLowerCase()))return toast('This phone/Gmail or name is already used');
  const u=mkUser(n,p,'staff',{});u.login=l;u.status='pending';db.users.push(u);
  notify('security','New account request: '+n+' ('+l+')','admin');save();authS.mode='';authS.last=l;toast('Account created. Wait for the admin to approve it.');draw();
}
function doLogin(){
  if(Date.now()<authS.until)return toast('Too many tries. Wait '+Math.ceil((authS.until-Date.now())/1000)+'s');
  const id=val('lu'),u=findUser(id);authS.last=id;
  if(u&&hp(val('lp'),u.salt)===u.h){
    if(u.status==='pending'){const e=$('lp');if(e)e.value='';return toast('Your account is waiting for admin approval')}
    cur=u;view='dash';authS.tries=0;idle=Date.now();if(u.role!=='admin')notify('login',u.name+' logged in','admin');checkDue();draw();
  }else{
    if(++authS.tries>=5){authS.until=Date.now()+30000;authS.tries=0;notify('security','5 wrong PIN attempts for '+(u?u.name:'unknown user'),'admin');save()}
    toast('Wrong phone/Gmail or PIN');const e=$('lp');if(e)e.value='';
  }
}
function recoverPin(){
  const a=db.users.find(u=>u.role==='admin'),p=val('rp1');
  if(Date.now()<authS.until)return toast('Too many tries. Wait a bit');
  if(!db.rec||hp(val('rc1').trim(),db.rec.salt)!==db.rec.h){if(++authS.tries>=5){authS.until=Date.now()+30000;authS.tries=0}return toast('Wrong recovery code')}
  if(!okPin(p))return toast('PIN must be 4–8 digits');
  a.salt=rnd();a.h=hp(p,a.salt);save();authS.mode='';toast('PIN reset. Login now');draw();
}

function addUser(){
  if(!cur||cur.role!=='admin')return;
  const n=val('un').trim(),l=normLogin(val('ul')),p=val('up');
  if(!n)return toast('Enter a name');if(!validLogin(l))return toast('Enter a valid phone number or Gmail');if(!okPin(p))return toast('PIN must be 4–8 digits');
  if(db.users.some(u=>u.login===l||u.name.toLowerCase()===n.toLowerCase()))return toast('Name or phone/Gmail already used');
  const u=mkUser(n,p,'staff',{sell:true});u.login=l;db.users.push(u);save();toast('Staff added ✓');draw();
}
function approveUser(id){if(!cur||cur.role!=='admin')return;const u=db.users.find(x=>x.id===id);if(!u)return;u.status='active';u.perms={sell:true};save();toast('Approved ✓');draw()}
function rejectUser(id){if(!cur||cur.role!=='admin')return;db.users=db.users.filter(u=>u.id!==id);save();draw()}
function setPerm(id,k,v){if(cur.role!=='admin')return;db.users.find(u=>u.id===id).perms[k]=v;save()}
function resetPin(id){const p=val('rp'+id);if(cur.role!=='admin')return;if(!okPin(p))return toast('PIN must be 4–8 digits');const u=db.users.find(x=>x.id===id);u.salt=rnd();u.h=hp(p,u.salt);save();toast('PIN changed ✓');draw()}
function delUser(id){if(cur.role!=='admin'||!confirm('Delete this staff account?'))return;db.users=db.users.filter(u=>u.id!==id);save();draw()}
function myPin(){
  const l=normLogin(val('ml')),p=val('mp');
  if(val('ml').trim()){if(!validLogin(l))return toast('Enter a valid phone number or Gmail');if(db.users.some(u=>u!==cur&&u.login===l))return toast('This login is used by another user');cur.login=l}
  if(p){if(!okPin(p))return toast('PIN must be 4–8 digits');cur.salt=rnd();cur.h=hp(p,cur.salt)}
  save();toast('Saved ✓');draw();
}

const sheet=(wb,n,d)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{}]),n);
async function saveWb(wb,fn){
  try{
    if(window.Android&&typeof Android.saveExcel==='function'){Android.saveExcel(fn,XLSX.write(wb,{type:'base64',bookType:'xlsx'}));toast('Excel export started ✓')}
    else if(window.claude&&claude.use){const dl=await claude.use('downloads');await dl.save({filename:fn,data:XLSX.write(wb,{type:'array',bookType:'xlsx'})});toast('Exported ✓')}
    else{XLSX.writeFile(wb,fn);toast('Exported ✓')}
  }catch(e){if(!e||e.code!=='declined')toast('Export failed')}
}
async function exportSales(){
  if(!can('export'))return toast('Not allowed');if(typeof XLSX==='undefined')return toast('Excel library not loaded');
  const f=ex.from||'0000-00-00',t=ex.to||'9999-99-99',ok=d=>d>=f&&d<=t,wb=XLSX.utils.book_new();
  sheet(wb,'Sales',db.sales.filter(s=>ok(s.date)).map(s=>({Date:s.date,Product:s.name,IMEI:s.imei,Qty:s.qty,'Unit price':s.price,Discount:s.disc,Total:s.total,Customer:s.cust,Phone:s.phone,Payment:s.pay==='inst'?'Installment':'Full',Received:paidOf(s),Due:s.returned?0:s.total-paidOf(s),Status:s.returned?'Returned':'Sold','Sold by':s.by||'',Account:s.acc})));
  sheet(wb,'Deleted sales',db.del.filter(s=>ok(s.date)).map(s=>({Date:s.date,Product:s.name,IMEI:s.imei,Total:s.total,Customer:s.cust,Phone:s.phone,'Sold by':s.by||'','Deleted on':s.delDate,'Deleted by':s.delBy})));
  await saveWb(wb,`sales_${ex.from}_to_${ex.to}.xlsx`);
}
async function exportStock(){
  if(!can('export'))return toast('Not allowed');if(typeof XLSX==='undefined')return toast('Excel library not loaded');
  const wb=XLSX.utils.book_new(),c=can('cost');
  sheet(wb,'By model',models().map(m=>{const n=m.list.filter(p=>p.status==='in').length;return{Model:m.name,'In stock':n,Sold:m.list.length-n,Total:m.list.length}}));
  sheet(wb,'Mobiles',db.phones.map(p=>{const s=db.sales.filter(x=>x.imei===p.imei&&!x.returned).slice(-1)[0],r={Model:p.brand+' '+p.model,IMEI:p.imei,Price:p.price};if(c){r.Cost=p.cost;r.Supplier=p.supplier}r.Added=p.date;r.Status=p.status==='in'?'In stock':'Sold';r['Sold to']=p.status==='in'||!s?'':s.cust+(s.phone?' '+s.phone:'');r['Sold on']=p.status==='in'||!s?'':s.date;return r}));
  sheet(wb,'Accessories',db.acc.map(a=>{const r={Name:a.name,Qty:a.qty,Price:a.price};if(c)r.Cost=a.cost;return r}));
  await saveWb(wb,`stock_${today()}.xlsx`);
}

function delPanel(s){return `<h2>Delete sale · ${esc(s.name)}${s.imei?' · '+esc(s.imei):''}</h2><small>${s.returned?'This sale was already returned, so only the record is removed.':'The item goes back to stock and the money received ('+M(paidOf(s))+') is taken back from the accounts.'} A copy is kept in the deleted-sales list of the Excel export.</small><div class="bar" style="margin:10px 0 0"><button class="btn" style="background:var(--bad);color:#fff" onclick="doDelete('${s.id}')">Yes, delete</button><button class="btn o" onclick="act=null;draw()">Cancel</button></div>`}
function doDelete(id){
  if(!can('delsale'))return toast('Not allowed');
  const s=db.sales.find(x=>x.id===id);if(!s)return;
  if(!s.returned){
    if(s.kind==='phone'){const p=db.phones.find(x=>x.imei===s.imei);if(p){p.status='in';delete p.saleId}}
    else{const a=db.acc.find(x=>x.name.toLowerCase()===s.name.toLowerCase());if(a)a.qty+=s.qty;else db.acc.push({id:uid(),name:s.name,qty:s.qty,cost:0,price:s.price})}
    const n='Deleted sale: '+s.name+(s.imei?' / '+s.imei:'');
    txn(s.acc,'out',s.paid,n,'refund');(s.pays||[]).forEach(p=>txn(p.acc,'out',p.amt,n,'refund'));
  }
  notify('delete',cur.name+' deleted sale: '+s.name+(s.imei?' ('+s.imei+')':'')+' '+M(s.total),'admin');db.sales=db.sales.filter(x=>x.id!==id);db.del.push(Object.assign({},s,{delBy:cur.name,delDate:today()}));
  save();act=null;toast('Sale deleted');draw();
}

function saveSet(){
  if(cur.role!=='admin')return;
  const n=val('s1').trim();if(!n)return toast('Enter shop name');
  Object.assign(db.set,{shop:n,addr:val('s2').trim(),tel:val('s3').trim(),low:Math.max(0,+val('s4')||0),lock:Math.max(1,+val('s5')||10),months:Math.min(36,Math.max(1,+val('s6')||3))});
  save();toast('Settings saved ✓');draw();
}
function syncAcc(){db.set.accs=[...ACCS];save();draw()}
function renAcc(i){
  if(cur.role!=='admin')return;const n=val('ra'+i).trim(),o=ACCS[i];
  if(!n)return toast('Enter a name');if(n!==o&&ACCS.includes(n))return toast('Name already used');
  db.txns.forEach(t=>{if(t.acc===o)t.acc=n});db.sales.forEach(s=>{if(s.acc===o)s.acc=n;(s.pays||[]).forEach(p=>{if(p.acc===o)p.acc=n})});
  ACCS[i]=n;sf.acc=ACCS[3]||ACCS[0];toast('Renamed ✓');syncAcc();
}
function addAccount(){if(cur.role!=='admin')return;const n=val('na').trim();if(!n)return toast('Enter a name');if(ACCS.includes(n))return toast('Name already used');ACCS.push(n);syncAcc()}
function delAccount(i){
  if(cur.role!=='admin')return;const a=ACCS[i];
  if(ACCS.length<=1)return toast('Keep at least one account');
  if(db.txns.some(t=>t.acc===a)||db.sales.some(s=>s.acc===a||(s.pays||[]).some(p=>p.acc===a)))return toast('This account has records, can’t remove');
  ACCS.splice(i,1);sf.acc=ACCS[3]||ACCS[0];syncAcc();
}

function onFilePicked(name,b64){
  const n=String(name).toLowerCase();let bin;
  try{bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}catch(e){return toast('Could not read file')}
  if(n.endsWith('.json'))restoreData(new TextDecoder().decode(bin));

function webPick(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const u=new Uint8Array(r.result);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));onFilePicked(f.name,btoa(s))};r.readAsArrayBuffer(f)}
function restoreData(txt){

  const cost=+val('pc')||0,price=+val('ps')||0,sup=val('pu').trim(),a=val('pa');
  r.ok.forEach(imei=>db.phones.push({id:uid(),brand,model,imei,cost,price,supplier:sup,date:today(),status:'in'}));
  notify('stock',(cur?cur.name:'')+' added '+r.ok.length+' × '+brand+' '+model+' to stock','admin');
  if(a)txn(a,'out',cost*r.ok.length,'Purchase: '+brand+' '+model+' ×'+r.ok.length,'purchase');
  save();toast(r.ok.length+' phone(s) added ✓');draw();
}
function shelves(){
  const ql=q.toLowerCase().trim();
  const S=models().map(m=>({m,L:m.list.filter(p=>!ql||(m.name+p.imei).toLowerCase().includes(ql))})).filter(x=>x.L.length);
  return S.length?S.map(({m,L})=>{const n=m.list.filter(p=>p.status==='in').length,pr=m.list[m.list.length-1].price;
    return `<details class="shelf"${ql?' open':''}><summary><div><b>${esc(m.name)}</b><small>${m.list.length-n} sold · price ${M(pr)}</small></div><span class="tag ${n?'ok':'bad'}">${n} in stock</span></summary>
    ${L.slice().reverse().map(p=>`<div class="row"><div><b style="font-weight:600">${esc(p.imei)}</b><small>${can('cost')?'cost '+M(p.cost)+(p.supplier?' · '+esc(p.supplier):'')+' · ':''}${p.date}</small></div><div class="r"><span class="tag ${p.status==='in'?'ok':''}">${p.status==='in'?'In stock':'Sold'}</span>${p.status==='in'&&can('del')?` <button class="btn g s" onclick="delPhone('${p.id}')">✕</button>`:''}</div></div>`).join('')}</details>`}).join(''):empty('No phones yet');
}
function list(){$('pl').innerHTML=shelves()}
function delPhone(id){if(!can('del'))return toast('Not allowed');if(!confirm('Remove this phone from stock?'))return;db.phones=db.phones.filter(p=>p.id!==id);save();draw()}

V.acc=()=>`${can('stockin')?`<div class="card"><h2>Add / restock accessory</h2><div class="f">
  <label>Name<input id="an" placeholder="Type-C cable"></label><label>Quantity<input id="aq" type="number" min="1"></label>
  <label>Cost each (৳)<input id="ac" type="number" min="0"></label><label>Selling price (৳)<input id="ap" type="number" min="0"></label>
  <label>Paid from<select id="aa"><option value="">Don’t record</option>${accOpts('')}</select></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addAcc()">Save to stock</button></div></div>`:''}
  <div class="card"><h2>Accessories stock</h2>${db.acc.length?db.acc.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><small>${can('cost')?'cost '+M(a.cost)+' · ':''}price ${M(a.price)}</small></div><div class="r"><span class="tag ${a.qty<=db.set.low?'bad':'ok'}">${a.qty} pcs</span> ${can('del')?`<button class="btn g s" onclick="delAcc('${a.id}')">✕</button>`:''}</div></div>`).join(''):empty('No accessories yet')}</div>${stockCard()}`;
function addAcc(){if(!can('stockin'))return toast('Not allowed');
  const name=val('an').trim(),qty=+val('aq'),cost=+val('ac')||0,price=+val('ap')||0,a=val('aa');
  if(!name||!(qty>0))return toast('Enter name and quantity');
  let it=db.acc.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(it){it.qty+=qty;if(cost)it.cost=cost;if(price)it.price=price}else db.acc.push({id:uid(),name,qty,cost,price});
  notify('stock',(cur?cur.name:'')+' added '+qty+' × '+name+' to stock','admin');
  if(a)txn(a,'out',cost*qty,'Stock: '+name+' ×'+qty,'purchase');
  save();toast('Stock updated ✓');draw();
}
function delAcc(id){if(!can('del'))return toast('Not allowed');if(!confirm('Delete this item?'))return;db.acc=db.acc.filter(a=>a.id!==id);save();draw()}

V.promos=()=>`<div class="card"><h2>New promo offer</h2><div class="f">
  <label>Offer name<input id="rn" placeholder="Eid offer"></label>
  <label>Type<select id="rt"><option value="pct">Percent (%)</option><option value="amt">Fixed amount (৳)</option></select></label>
  <label>Value<input id="rv" type="number" min="0"></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addPromo()">Create offer</button></div></div>
  <div class="card"><h2>Offers</h2>${db.promos.length?db.promos.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>${p.type==='pct'?p.val+'% off':M(p.val)+' off'}</small></div><div class="r"><button class="btn o s" onclick="togPromo('${p.id}')">${p.on?'Active':'Paused'}</button> <button class="btn g s" onclick="delPromo('${p.id}')">✕</button></div></div>`).join(''):empty('No offers yet')}</div>`;
function addPromo(){if(!can('promos'))return toast('Not allowed');const name=val('rn').trim(),v=+val('rv');if(!name||!(v>0))return toast('Enter name and value');db.promos.push({id:uid(),name,type:val('rt'),val:v,on:true});save();draw()}
function togPromo(id){if(!can('promos'))return toast('Not allowed');const p=db.promos.find(x=>x.id===id);p.on=!p.on;save();draw()}
function delPromo(id){if(!can('promos'))return toast('Not allowed');db.promos=db.promos.filter(p=>p.id!==id);save();draw()}

V.inst=()=>{
  const L=db.sales.filter(s=>s.pay==='inst'&&!s.returned).slice().reverse();
  const open=L.filter(s=>s.total-paidOf(s)>0),done=L.filter(s=>s.total-paidOf(s)<=0);
  const card=s=>{const paid=paidOf(s),due=s.total-paid,n=(s.pays||[]).length+1,nd=addM(s.date,n),late=due>0&&nd<today();
  return `<div class="card"><div class="row" style="border:0;padding-top:0"><div><b>${esc(s.cust)}</b><small>${esc(s.phone)} · ${esc(s.name)}${s.imei?' · '+esc(s.imei):''}</small></div><div class="r"><b class="${due>0?'warn':'ok'}">${due>0?M(due)+' due':'Paid'}</b><small>of ${M(s.total)}</small></div></div>
  ${due>0?`<small class="${late?'bad':''}" style="color:${late?'':'var(--mu)'}">Next due ${nd}${late?' · OVERDUE':''} · ${M(s.monthly)}/month</small>
  <div class="bar" style="margin:8px 0 0"><label>Amount<input id="ia${s.id}" type="number" min="1" value="${Math.min(s.monthly,due)}"></label><label>Into<select id="ib${s.id}">${accOpts(s.acc)}</select></label><button class="btn s" onclick="payInst('${s.id}')">Receive</button></div>`:''}</div>`};
  return open.length||done.length?`<h2>Open (${open.length})</h2>${open.length?open.map(card).join(''):empty('None')}${done.length?`<h2>Completed</h2>${done.map(card).join('')}`:''}`:`<div class="card">${empty('No installment sales yet')}</div>`;
};
function payInst(id){if(!can('inst'))return toast('Not allowed');
  const s=db.sales.find(x=>x.id===id),a=+val('ia'+id),acc=val('ib'+id),due=s.total-paidOf(s);
  if(!(a>0)||a>due)return toast('Amount must be 1–'+Math.round(due));
  s.pays.push({date:today(),amt:a,acc});notify('inst',cur.name+' received '+M(a)+' from '+s.cust+' ('+s.name+')','admin');txn(acc,'in',a,'Installment: '+s.cust+' / '+s.name,'inst');save();toast('Payment received ✓');draw();
}

V.accounts=()=>{
  const T=db.txns.slice().reverse().slice(0,40);
  return `<div class="grid" style="margin-bottom:12px">${ACCS.map(a=>`<div class="card"><div class="k">${a}</div><div class="v ${bal(a)<0?'bad':''}">${M(bal(a))}</div></div>`).join('')}</div>
  <div class="card"><h2>Add entry (opening balance, deposit, expense…)</h2><div class="f">
  <label>Account<select id="ta">${accOpts('')}</select></label><label>Type<select id="tt"><option value="in">Money in</option><option value="out">Money out</option></select></label>
  <label>Amount (৳)<input id="tm" type="number" min="1"></label><label>Note<input id="tn" placeholder="Opening balance"></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addTxn()">Save entry</button></div></div>
  <div class="card"><h2>Export to Excel</h2><div class="bar"><label>From<input type="date" value="${ex.from}" onchange="ex.from=this.value"></label><label>To<input type="date" value="${ex.to}" onchange="ex.to=this.value"></label><button class="btn" onclick="exportX()">⬇ Export .xlsx</button></div></div>
  <div class="card"><h2>Recent transactions</h2>${T.length?T.map(t=>`<div class="row"><div><b>${esc(t.note)}</b><small>${t.date} ${t.time||''} · ${esc(t.acc)}</small></div><b class="${t.type==='in'?'ok':'bad'}">${t.type==='in'?'+':'−'}${M(t.amt)}</b></div>`).join(''):empty('No transactions yet')}</div>`;
};
function addTxn(){if(!can('accounts'))return toast('Not allowed');const a=+val('tm');if(!(a>0))return toast('Enter an amount');txn(val('ta'),val('tt'),a,val('tn').trim()||'Manual entry','manual');save();toast('Saved ✓');draw()}
async function exportX(){if(!can('accounts'))return toast('Not allowed');
  const f=ex.from||'0000-00-00',t=ex.to||'9999-99-99',ok=d=>d>=f&&d<=t;
  if(typeof XLSX==='undefined')return toast('Excel library not loaded');
  const tx=db.txns.filter(x=>ok(x.date)).map(x=>({Date:x.date,Time:x.time||'',Account:x.acc,Type:x.type==='in'?'In':'Out',Amount:x.amt,Note:x.note}));
  const sl=db.sales.filter(x=>ok(x.date)).map(s=>({Date:s.date,Product:s.name,IMEI:s.imei,Qty:s.qty,Price:s.price,Discount:s.disc,Total:s.total,Customer:s.cust,By:s.by||'',Phone:s.phone,Payment:s.pay==='inst'?'Installment':'Full',Paid:paidOf(s),Due:s.total-paidOf(s)}));
  const sm=ACCS.map(a=>{const r=db.txns.filter(x=>x.acc===a&&ok(x.date));const i=r.filter(x=>x.type==='in').reduce((s,x)=>s+x.amt,0),o=r.filter(x=>x.type==='out').reduce((s,x)=>s+x.amt,0);return{Account:a,In:i,Out:o,Net:i-o,'Balance now':bal(a)}});
  const wb=XLSX.utils.book_new();wb.Props={Title:'TECNO Official Showroom by TECH Hub'};
  [['Summary',sm],['Transactions',tx],['Sales',sl],['Mobile stock',db.phones.map(p=>({Model:p.brand+' '+p.model,IMEI:p.imei,Cost:p.cost,Price:p.price,Supplier:p.supplier,Added:p.date,Status:p.status==='in'?'In stock':'Sold'}))]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{}]),n));
  try{const fn=`accounts_${ex.from}_to_${ex.to}.xlsx`;
    if(window.Android&&typeof Android.saveExcel==='function'){Android.saveExcel(fn,XLSX.write(wb,{type:'base64',bookType:'xlsx'}));toast('Excel export started ✓')}
    else if(window.claude&&claude.use){const dl=await claude.use('downloads');await dl.save({filename:fn,data:XLSX.write(wb,{type:'array',bookType:'xlsx'})});toast('Exported ✓')}
    else{XLSX.writeFile(wb,fn);toast('Exported ✓')}
  }catch(e){if(!e||e.code!=='declined')toast('Export failed')}
}
draw();
</script></body></html>
