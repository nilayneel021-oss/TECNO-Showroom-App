<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TECNO Official Showroom by TECH Hub</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#14182b;--mu:#6b7287;--bd:#e3e7f1;--pr:#4f46e5;--pt:#fff;--ok:#0f9d6b;--bad:#dc2f4a;--warn:#d98a0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mu:#9aa1ba;--bd:#2a3050;--pr:#818cf8;--pt:#10132a;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1220;--card:#181c30;--tx:#eef0fa;--mu:#9aa1ba;--bd:#2a3050;--pr:#818cf8;--pt:#10132a;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.top h1{font-size:16px;margin:0;line-height:1.25}.top small{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
nav button{flex:none;border:0;background:transparent;color:var(--mu);padding:8px 13px;border-radius:99px;font:600 13px inherit;font-family:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:var(--pt)}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.grid .card{margin:0}
.k{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.v{font-size:22px;font-weight:700;margin-top:2px}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:0}.hero .k{color:#dcd9ff}
h2{font-size:15px;margin:0 0 10px}
form,.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
label{display:grid;gap:4px;font-size:12px;color:var(--mu);font-weight:600}
input,select{width:100%;padding:10px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:0}
.btn{border:0;background:var(--pr);color:var(--pt);padding:11px 16px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.btn.s{padding:7px 11px;font-size:12px}.btn.g{background:transparent;color:var(--bad);border:1px solid var(--bd)}.btn.o{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}.row b{display:block}.row small{color:var(--mu)}
.r{text-align:right}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.full{grid-column:1/-1}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px}
.bar label{flex:1;min-width:130px}
.empty{color:var(--mu);text-align:center;padding:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90%}
#toast.show{opacity:1}
</style></head>
<body>
<header><div class="top"><div><h1>📱 TECNO Official Showroom by TECH Hub</h1><small>Bazar Road, Beside The One Bank, Sadar Lakshmipur</small><br><small id="dt"></small></div></div><nav id="nav"></nav></header>
<main id="app"></main><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ACCS=['BRAC Bank','Tecno Virtual Account','PalmPay','Cash On Hand'];
const K='mobshop_v1';
let db={phones:[],acc:[],promos:[],sales:[],txns:[]};
try{const s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmt(new Date());
const addM=(s,n)=>{const d=new Date(s+'T00:00');d.setMonth(d.getMonth()+n);return fmt(d)};
const M=n=>'৳'+Math.round(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>($(id)||{}).value||'';
const opts=(arr,sel)=>arr.map(a=>`<option value="${esc(a[0])}"${a[0]===sel?' selected':''}>${esc(a[1])}</option>`).join('');
const accOpts=sel=>opts(ACCS.map(a=>[a,a]),sel);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function txn(acc,type,amt,note,cat){if(amt>0)db.txns.push({id:uid(),date:today(),time:new Date().toTimeString().slice(0,5),acc,type,amt,note,cat})}
const bal=a=>db.txns.filter(t=>t.acc===a).reduce((s,t)=>s+(t.type==='in'?t.amt:-t.amt),0);
const paidOf=s=>s.paid+(s.pays||[]).reduce((a,p)=>a+p.amt,0);

let view='dash',dd=today(),sf={kind:'phone',item:'',qty:1,price:'',promo:'',cust:'',phone:'',pay:'full',down:'',months:3,acc:ACCS[3]};
let q='',ex={from:today(),to:today()};
const TABS=[['dash','Dashboard'],['sell','Sell'],['phones','Mobiles'],['acc','Accessories'],['inst','Installments'],['accounts','Accounts'],['promos','Promos']];
$('nav').innerHTML=TABS.map(t=>`<button data-v="${t[0]}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
function go(v){view=v;q='';draw()}
function draw(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  $('dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
  $('app').innerHTML=V[view]();
}
const empty=t=>`<div class="empty">${t}</div>`;

const V={};
V.dash=()=>{
  const S=db.sales.filter(s=>s.date===dd);
  const tot=S.reduce((a,s)=>a+s.total,0);
  const col=db.txns.filter(t=>t.date===dd&&t.type==='in'&&(t.cat==='sale'||t.cat==='inst')).reduce((a,t)=>a+t.amt,0);
  const stock=db.phones.filter(p=>p.status==='in').length;
  const low=db.acc.filter(a=>a.qty<=3);
  const due=db.sales.filter(s=>s.pay==='inst').reduce((a,s)=>a+Math.max(0,s.total-paidOf(s)),0);
  return `<div class="card hero"><div class="k">${dd===today()?'Today':esc(dd)} · Sales</div><div class="v" style="font-size:32px">${M(tot)}</div><div style="opacity:.9">${S.length} sale(s) · collected ${M(col)}</div></div>
  <div class="grid" style="margin-bottom:12px">
   ${ACCS.map(a=>`<div class="card"><div class="k">${a}</div><div class="v ${bal(a)<0?'bad':''}">${M(bal(a))}</div></div>`).join('')}
   <div class="card"><div class="k">Phones in stock</div><div class="v">${stock}</div></div>
   <div class="card"><div class="k">Installment due</div><div class="v warn">${M(due)}</div></div></div>
  <div class="card"><div class="bar"><label>Check sales of date<input type="date" value="${dd}" onchange="dd=this.value||today();draw()"></label></div>
  <h2>Products sold</h2>
  ${S.length?S.slice().reverse().map(s=>`<div class="row"><div><b>${esc(s.name)}${s.qty>1?' ×'+s.qty:''}</b><small>${s.imei?'IMEI '+esc(s.imei)+' · ':''}${esc(s.cust||'Walk-in')}${s.phone?' · '+esc(s.phone):''}</small></div><div class="r"><b>${M(s.total)}</b>${s.pay==='inst'?'<span class="tag">Installment</span>':''}</div></div>`).join(''):empty('No sales on this date')}</div>
  ${low.length?`<div class="card"><h2>⚠️ Low accessories stock</h2>${low.map(a=>`<div class="row"><b>${esc(a.name)}</b><span class="tag bad">${a.qty} left</span></div>`).join('')}</div>`:''}`;
};

V.sell=()=>{
  const ph=db.phones.filter(p=>p.status==='in'),ac=db.acc.filter(a=>a.qty>0);
  const items=sf.kind==='phone'?ph.map(p=>[p.id,`${p.brand} ${p.model} · ${p.imei}`]):ac.map(a=>[a.id,`${a.name} (${a.qty} in stock)`]);
  const g=calc();
  return `<div class="card"><h2>New sale</h2><div class="f">
  <label>Type<select onchange="sset('kind',this.value);sf.item='';sf.price='';draw()"><option value="phone"${sf.kind==='phone'?' selected':''}>Mobile phone</option><option value="acc"${sf.kind==='acc'?' selected':''}>Accessory</option></select></label>
  <label class="full">Product<select onchange="pick(this.value)"><option value="">— select —</option>${opts(items,sf.item)}</select></label>
  ${sf.kind==='acc'?`<label>Quantity<input type="number" min="1" value="${sf.qty}" onchange="sset('qty',this.value);draw()"></label>`:''}
  <label>Unit price (৳)<input type="number" min="0" value="${sf.price}" onchange="sset('price',this.value);draw()"></label>
  <label>Promo offer<select onchange="sset('promo',this.value);draw()"><option value="">None</option>${opts(db.promos.filter(p=>p.on).map(p=>[p.id,p.name+' ('+(p.type==='pct'?p.val+'%':M(p.val))+')']),sf.promo)}</select></label>
  <label>Customer name<input value="${esc(sf.cust)}" onchange="sset('cust',this.value)"></label>
  <label>Customer number<input type="tel" value="${esc(sf.phone)}" onchange="sset('phone',this.value)"></label>
  <label>Payment<select onchange="sset('pay',this.value);draw()"><option value="full"${sf.pay==='full'?' selected':''}>Full payment</option><option value="inst"${sf.pay==='inst'?' selected':''}>Installment</option></select></label>
  ${sf.pay==='inst'?`<label>Down payment (৳)<input type="number" min="0" value="${sf.down}" onchange="sset('down',this.value);draw()"></label><label>Months<input type="number" min="1" max="36" value="${sf.months}" onchange="sset('months',this.value);draw()"></label>`:''}
  <label>Money received into<select onchange="sset('acc',this.value)">${accOpts(sf.acc)}</select></label></div>
  <div class="row" style="margin-top:10px"><div><small>Discount ${M(g.disc)}</small><b style="font-size:20px">Total ${M(g.total)}</b>${sf.pay==='inst'?`<small>Balance ${M(g.total-g.down)} · ${M(g.monthly)}/month</small>`:''}</div><button class="btn" onclick="sell()">Complete sale</button></div></div>`;
};
function sset(k,v){sf[k]=v}
function pick(id){sf.item=id;const it=sf.kind==='phone'?db.phones.find(p=>p.id===id):db.acc.find(a=>a.id===id);sf.price=it?it.price:'';draw()}
function calc(){
  const qty=sf.kind==='phone'?1:Math.max(1,+sf.qty||1),gross=(+sf.price||0)*qty;
  const p=db.promos.find(x=>x.id===sf.promo);
  const disc=p?Math.min(gross,p.type==='pct'?Math.round(gross*p.val/100):p.val):0;
  const total=gross-disc,months=Math.max(1,+sf.months||1);
  const down=sf.pay==='inst'?Math.min(total,Math.max(0,+sf.down||0)):total;
  return{qty,gross,disc,total,down,months,monthly:Math.ceil((total-down)/months)};
}
function sell(){
  const g=calc();
  const it=sf.kind==='phone'?db.phones.find(p=>p.id===sf.item):db.acc.find(a=>a.id===sf.item);
  if(!it)return toast('Select a product');
  if(!(+sf.price>0))return toast('Enter a price');
  if(sf.kind==='acc'&&g.qty>it.qty)return toast('Only '+it.qty+' in stock');
  if(sf.pay==='inst'&&(!sf.cust.trim()||!sf.phone.trim()))return toast('Customer name & number required');
  const s={id:uid(),date:today(),kind:sf.kind,name:sf.kind==='phone'?it.brand+' '+it.model:it.name,imei:it.imei||'',qty:g.qty,price:+sf.price,disc:g.disc,total:g.total,cust:sf.cust.trim(),phone:sf.phone.trim(),pay:sf.pay,paid:g.down,acc:sf.acc,months:g.months,monthly:g.monthly,pays:[]};
  db.sales.push(s);
  if(sf.kind==='phone'){it.status='sold';it.saleId=s.id}else it.qty-=g.qty;
  txn(sf.acc,'in',g.down,'Sale: '+s.name+(s.imei?' / '+s.imei:''),'sale');
  save();sf={kind:sf.kind,item:'',qty:1,price:'',promo:'',cust:'',phone:'',pay:'full',down:'',months:3,acc:sf.acc};
  toast('Sale saved ✓');draw();
}

V.phones=()=>{
  const L=db.phones.filter(p=>(p.brand+p.model+p.imei).toLowerCase().includes(q.toLowerCase())).slice().reverse();
  return `<div class="card"><h2>Purchase mobile</h2><div class="f">
  <label>Brand<input id="pb" placeholder="Tecno"></label><label>Model<input id="pm" placeholder="Spark 20"></label>
  <label>IMEI (15 digits)<input id="pi" inputmode="numeric" maxlength="15"></label>
  <label>Purchase price (৳)<input id="pc" type="number" min="0"></label><label>Selling price (৳)<input id="ps" type="number" min="0"></label>
  <label>Supplier<input id="pu"></label><label>Paid from<select id="pa"><option value="">Don’t record</option>${accOpts('')}</select></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addPhone()">Add to stock</button></div></div>
  <div class="card"><div class="bar"><label>Search model / IMEI<input value="${esc(q)}" oninput="q=this.value;list()" id="qs"></label></div>
  <div id="pl">${plist(L)}</div></div>`;
};
const plist=L=>L.length?L.map(p=>`<div class="row"><div><b>${esc(p.brand)} ${esc(p.model)}</b><small>IMEI ${esc(p.imei)} · cost ${M(p.cost)}${p.supplier?' · '+esc(p.supplier):''}</small></div><div class="r"><b>${M(p.price)}</b><span class="tag ${p.status==='in'?'ok':''}">${p.status==='in'?'In stock':'Sold'}</span>${p.status==='in'?` <button class="btn g s" onclick="delPhone('${p.id}')">✕</button>`:''}</div></div>`).join(''):empty('No phones yet');
function list(){const L=db.phones.filter(p=>(p.brand+p.model+p.imei).toLowerCase().includes(q.toLowerCase())).slice().reverse();$('pl').innerHTML=plist(L)}
function addPhone(){
  const imei=val('pi').trim(),brand=val('pb').trim(),model=val('pm').trim();
  if(!brand||!model)return toast('Enter brand and model');
  if(!/^\d{15}$/.test(imei))return toast('IMEI must be 15 digits');
  if(db.phones.some(p=>p.imei===imei))return toast('This IMEI already exists');
  const cost=+val('pc')||0,a=val('pa');
  db.phones.push({id:uid(),brand,model,imei,cost,price:+val('ps')||0,supplier:val('pu').trim(),date:today(),status:'in'});
  if(a)txn(a,'out',cost,'Purchase: '+brand+' '+model+' / '+imei,'purchase');
  save();toast('Added to stock ✓');draw();
}
function delPhone(id){if(!confirm('Remove this phone from stock?'))return;db.phones=db.phones.filter(p=>p.id!==id);save();draw()}

V.acc=()=>`<div class="card"><h2>Add / restock accessory</h2><div class="f">
  <label>Name<input id="an" placeholder="Type-C cable"></label><label>Quantity<input id="aq" type="number" min="1"></label>
  <label>Cost each (৳)<input id="ac" type="number" min="0"></label><label>Selling price (৳)<input id="ap" type="number" min="0"></label>
  <label>Paid from<select id="aa"><option value="">Don’t record</option>${accOpts('')}</select></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addAcc()">Save to stock</button></div></div>
  <div class="card"><h2>Accessories stock</h2>${db.acc.length?db.acc.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><small>cost ${M(a.cost)} · price ${M(a.price)}</small></div><div class="r"><span class="tag ${a.qty<=3?'bad':'ok'}">${a.qty} pcs</span> <button class="btn g s" onclick="delAcc('${a.id}')">✕</button></div></div>`).join(''):empty('No accessories yet')}</div>`;
function addAcc(){
  const name=val('an').trim(),qty=+val('aq'),cost=+val('ac')||0,price=+val('ap')||0,a=val('aa');
  if(!name||!(qty>0))return toast('Enter name and quantity');
  let it=db.acc.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(it){it.qty+=qty;if(cost)it.cost=cost;if(price)it.price=price}else db.acc.push({id:uid(),name,qty,cost,price});
  if(a)txn(a,'out',cost*qty,'Stock: '+name+' ×'+qty,'purchase');
  save();toast('Stock updated ✓');draw();
}
function delAcc(id){if(!confirm('Delete this item?'))return;db.acc=db.acc.filter(a=>a.id!==id);save();draw()}

V.promos=()=>`<div class="card"><h2>New promo offer</h2><div class="f">
  <label>Offer name<input id="rn" placeholder="Eid offer"></label>
  <label>Type<select id="rt"><option value="pct">Percent (%)</option><option value="amt">Fixed amount (৳)</option></select></label>
  <label>Value<input id="rv" type="number" min="0"></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addPromo()">Create offer</button></div></div>
  <div class="card"><h2>Offers</h2>${db.promos.length?db.promos.map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>${p.type==='pct'?p.val+'% off':M(p.val)+' off'}</small></div><div class="r"><button class="btn o s" onclick="togPromo('${p.id}')">${p.on?'Active':'Paused'}</button> <button class="btn g s" onclick="delPromo('${p.id}')">✕</button></div></div>`).join(''):empty('No offers yet')}</div>`;
function addPromo(){const name=val('rn').trim(),v=+val('rv');if(!name||!(v>0))return toast('Enter name and value');db.promos.push({id:uid(),name,type:val('rt'),val:v,on:true});save();draw()}
function togPromo(id){const p=db.promos.find(x=>x.id===id);p.on=!p.on;save();draw()}
function delPromo(id){db.promos=db.promos.filter(p=>p.id!==id);save();draw()}

V.inst=()=>{
  const L=db.sales.filter(s=>s.pay==='inst').slice().reverse();
  const open=L.filter(s=>s.total-paidOf(s)>0),done=L.filter(s=>s.total-paidOf(s)<=0);
  const card=s=>{const paid=paidOf(s),due=s.total-paid,n=(s.pays||[]).length+1,nd=addM(s.date,n),late=due>0&&nd<today();
  return `<div class="card"><div class="row" style="border:0;padding-top:0"><div><b>${esc(s.cust)}</b><small>${esc(s.phone)} · ${esc(s.name)}${s.imei?' · '+esc(s.imei):''}</small></div><div class="r"><b class="${due>0?'warn':'ok'}">${due>0?M(due)+' due':'Paid'}</b><small>of ${M(s.total)}</small></div></div>
  ${due>0?`<small class="${late?'bad':''}" style="color:${late?'':'var(--mu)'}">Next due ${nd}${late?' · OVERDUE':''} · ${M(s.monthly)}/month</small>
  <div class="bar" style="margin:8px 0 0"><label>Amount<input id="ia${s.id}" type="number" min="1" value="${Math.min(s.monthly,due)}"></label><label>Into<select id="ib${s.id}">${accOpts(s.acc)}</select></label><button class="btn s" onclick="payInst('${s.id}')">Receive</button></div>`:''}</div>`};
  return open.length||done.length?`<h2>Open (${open.length})</h2>${open.length?open.map(card).join(''):empty('None')}${done.length?`<h2>Completed</h2>${done.map(card).join('')}`:''}`:`<div class="card">${empty('No installment sales yet')}</div>`;
};
function payInst(id){
  const s=db.sales.find(x=>x.id===id),a=+val('ia'+id),acc=val('ib'+id),due=s.total-paidOf(s);
  if(!(a>0)||a>due)return toast('Amount must be 1–'+Math.round(due));
  s.pays.push({date:today(),amt:a,acc});txn(acc,'in',a,'Installment: '+s.cust+' / '+s.name,'inst');save();toast('Payment received ✓');draw();
}

V.accounts=()=>{
  const T=db.txns.slice().reverse().slice(0,40);
  return `<div class="grid" style="margin-bottom:12px">${ACCS.map(a=>`<div class="card"><div class="k">${a}</div><div class="v ${bal(a)<0?'bad':''}">${M(bal(a))}</div></div>`).join('')}</div>
  <div class="card"><h2>Add entry (opening balance, deposit, expense…)</h2><div class="f">
  <label>Account<select id="ta">${accOpts('')}</select></label><label>Type<select id="tt"><option value="in">Money in</option><option value="out">Money out</option></select></label>
  <label>Amount (৳)<input id="tm" type="number" min="1"></label><label>Note<input id="tn" placeholder="Opening balance"></label></div>
  <div style="margin-top:10px"><button class="btn" onclick="addTxn()">Save entry</button></div></div>
  <div class="card"><h2>Export to Excel</h2><div class="bar"><label>From<input type="date" value="${ex.from}" onchange="ex.from=this.value"></label><label>To<input type="date" value="${ex.to}" onchange="ex.to=this.value"></label><button class="btn" onclick="exportX()">⬇ Export .xlsx</button></div></div>
  <div class="card"><h2>Recent transactions</h2>${T.length?T.map(t=>`<div class="row"><div><b>${esc(t.note)}</b><small>${t.date} ${t.time||''} · ${esc(t.acc)}</small></div><b class="${t.type==='in'?'ok':'bad'}">${t.type==='in'?'+':'−'}${M(t.amt)}</b></div>`).join(''):empty('No transactions yet')}</div>`;
};
function addTxn(){const a=+val('tm');if(!(a>0))return toast('Enter an amount');txn(val('ta'),val('tt'),a,val('tn').trim()||'Manual entry','manual');save();toast('Saved ✓');draw()}
async function exportX(){
  const f=ex.from||'0000-00-00',t=ex.to||'9999-99-99',ok=d=>d>=f&&d<=t;
  if(typeof XLSX==='undefined')return toast('Excel library not loaded');
  const tx=db.txns.filter(x=>ok(x.date)).map(x=>({Date:x.date,Time:x.time||'',Account:x.acc,Type:x.type==='in'?'In':'Out',Amount:x.amt,Note:x.note}));
  const sl=db.sales.filter(x=>ok(x.date)).map(s=>({Date:s.date,Product:s.name,IMEI:s.imei,Qty:s.qty,Price:s.price,Discount:s.disc,Total:s.total,Customer:s.cust,Phone:s.phone,Payment:s.pay==='inst'?'Installment':'Full',Paid:paidOf(s),Due:s.total-paidOf(s)}));
  const sm=ACCS.map(a=>{const r=db.txns.filter(x=>x.acc===a&&ok(x.date));const i=r.filter(x=>x.type==='in').reduce((s,x)=>s+x.amt,0),o=r.filter(x=>x.type==='out').reduce((s,x)=>s+x.amt,0);return{Account:a,In:i,Out:o,Net:i-o,'Balance now':bal(a)}});
  const wb=XLSX.utils.book_new();wb.Props={Title:'TECNO Official Showroom by TECH Hub'};
  [['Summary',sm],['Transactions',tx],['Sales',sl]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{}]),n));
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  try{
    const filename=`accounts_${ex.from}_to_${ex.to}.xlsx`;
    if(window.Android&&typeof Android.saveExcel==='function'){
      const b64=XLSX.write(wb,{type:'base64',bookType:'xlsx'});
      Android.saveExcel(filename,b64);toast('Excel export started ✓');
    }else{XLSX.writeFile(wb,filename);toast('Exported ✓')}
  }catch(e){toast('Export failed')}
}
draw();
</script></body></html>
